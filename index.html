<script>
        (function () {
            const FX_CACHE_KEY = 'nthe_live_fx_v2';
            const FX_TTL_MS = 4 * 60 * 60 * 1000;
            let RATES_TO_INR = { USD: 93.00, EUR: 100.50, GBP: 118.20, AUD: 61.00, CAD: 66.50 };
            let fxStatusText = 'Syncing';

            const GATEWAY_PRESETS = {
                wise:     { spread: 0.5, label: 'Wise / Skydo (~0.5%)' },
                bankwire: { spread: 1.8, label: 'Bank Wire (~1.8%)' },
                payoneer: { spread: 2.0, label: 'Payoneer (~2.0%)' },
                paypal:   { spread: 3.5, label: 'PayPal (~3.5%)' },
                custom:   { spread: 1.5, label: 'Custom Gateway' }
            };

            const TAX_RATES = {
                'in-tds-1':   0.01,
                'in-gst-tds': 0.028,
                'in-44ada':   0.05,
                'us-self':    0.15,
                'none':       0.00
            };

            const PRESET_SCENARIOS = [
                { title: 'Upwork + Wise (India TDS)', amount: 1500, currency: 'USD', platform: '10', gateway: 'wise', spread: 0.5, tax: 'in-tds-1', hours: 20 },
                { title: 'Upwork + PayPal (High FX)', amount: 1500, currency: 'USD', platform: '10', gateway: 'paypal', spread: 3.5, tax: 'in-tds-1', hours: 20 },
                { title: 'Fiverr + Payoneer (20% Fee)', amount: 1000, currency: 'USD', platform: '20', gateway: 'payoneer', spread: 2.0, tax: 'in-tds-1', hours: 15 },
                { title: 'Direct Client + Wise (0% Fee)', amount: 2500, currency: 'USD', platform: '0', gateway: 'wise', spread: 0.5, tax: 'in-44ada', hours: 25 },
                { title: 'EUR Client + Bank Wire', amount: 1200, currency: 'EUR', platform: '0', gateway: 'bankwire', spread: 1.8, tax: 'in-tds-1', hours: 20 },
                { title: 'GBP Client + Wise', amount: 1000, currency: 'GBP', platform: '10', gateway: 'wise', spread: 0.5, tax: 'in-tds-1', hours: 20 }
            ];

            const $ = (id) => document.getElementById(id);

            const els = {
                currency: $('currencySelect'),
                symbolPrefix: $('currencySymbolPrefix'),
                amount: $('inputAmount'),
                platform: $('platformSelect'),
                customPlatformBox: $('customPlatformBox'),
                customPlatformSlider: $('customPlatformSlider'),
                customPlatformVal: $('customPlatformVal'),
                gateway: $('gatewaySelect'),
                fxSpreadSlider: $('fxSpreadSlider'),
                fxSpreadLabel: $('fxSpreadLabel'),
                tax: $('taxSelect'),
                hours: $('hoursSlider'),
                hoursVal: $('hoursVal'),
                livePairLabel: $('livePairLabel'),
                liveRateDisplay: $('liveRateDisplay'),
                fxStatusDot: $('fxStatusDot'),
                fxSourceBadge: $('fxSourceBadge'),
                refreshFxBtn: $('refreshFxBtn'),
                baseRateSummary: $('baseRateSummary'),
                netTakeHomeINR: $('netTakeHomeINR'),
                netTakeHomeForeign: $('netTakeHomeForeign'),
                netCurrencyCode: $('netCurrencyCode'),
                realHourlyRate: $('realHourlyRate'),
                grossHourly: $('grossHourly'),
                retentionPercent: $('retentionPercent'),
                barTakeHome: $('barTakeHome'),
                barPlatform: $('barPlatform'),
                barFx: $('barFx'),
                barTax: $('barTax'),
                outGrossUSD: $('outGrossUSD'),
                outGrossINR: $('outGrossINR'),
                outPlatformPct: $('outPlatformPct'),
                outPlatformUSD: $('outPlatformUSD'),
                outPlatformINR: $('outPlatformINR'),
                outFxPct: $('outFxPct'),
                outFxUSD: $('outFxUSD'),
                outFxINR: $('outFxINR'),
                outTaxUSD: $('outTaxUSD'),
                outTaxINR: $('outTaxINR'),
                comparisonTableBody: $('comparisonTableBody'),
                lossAlertINR: $('lossAlertINR'),
                potentialSavingsINR: $('potentialSavingsINR'),
                presetGrid: $('pseoPresetGrid'),
                copyShareBtn: $('copyShareBtn'),
                exportCsvBtn: $('exportCsvBtn')
            };

            function getSymbol(code) {
                return ({ USD: '$', EUR: '€', GBP: '£', AUD: 'A$', CAD: 'C$' })[code] \vert{}\vert{} '$';
            }

            function fmtINR(n) {
                return '₹' + Math.round(Number.isFinite(n) ? n : 0).toLocaleString('en-IN');
            }

            function fmtForeign(n, sym) {
                return sym + (Number.isFinite(n) ? n.toFixed(2) : '0.00');
            }

            function updateBadgeUI() {
                if (els.fxSourceBadge) {
                    els.fxSourceBadge.textContent = fxStatusText;
                }
                if (els.fxStatusDot) {
                    if (fxStatusText === 'Live') {
                        els.fxStatusDot.className = 'w-2 h-2 rounded-full bg-emerald-500 animate-pulse';
                    } else if (fxStatusText === 'Syncing') {
                        els.fxStatusDot.className = 'w-2 h-2 rounded-full bg-amber-400 animate-pulse';
                    } else {
                        els.fxStatusDot.className = 'w-2 h-2 rounded-full bg-amber-500';
                    }
                }
            }

            function loadCache() {
                try {
                    const raw = localStorage.getItem(FX_CACHE_KEY);
                    if (!raw) return false;
                    const parsed = JSON.parse(raw);
                    if (parsed && parsed.rates && typeof parsed.rates.USD === 'number' && (Date.now() - parsed.ts < FX_TTL_MS)) {
                        RATES_TO_INR = Object.assign({}, RATES_TO_INR, parsed.rates);
                        fxStatusText = 'Live';
                        return true;
                    }
                } catch (_) {}
                return false;
            }

            function saveCache(rates) {
                try {
                    localStorage.setItem(FX_CACHE_KEY, JSON.stringify({ ts: Date.now(), rates: rates }));
                } catch (_) {}
            }

            async function fetchFreshRates() {
                try {
                    const r1 = await fetch('https://open.er-api.com/v6/latest/USD', { cache: 'no-store' });
                    if (r1.ok) {
                        const d1 = await r1.json();
                        const inr1 = d1 && d1.rates && d1.rates.INR;
                        if (typeof inr1 === 'number' && inr1 > 40 && inr1 < 300) {
                            return {
                                USD: Number(inr1.toFixed(2)),
                                EUR: d1.rates.EUR ? Number((inr1 / d1.rates.EUR).toFixed(2)) : RATES_TO_INR.EUR,
                                GBP: d1.rates.GBP ? Number((inr1 / d1.rates.GBP).toFixed(2)) : RATES_TO_INR.GBP,
                                AUD: d1.rates.AUD ? Number((inr1 / d1.rates.AUD).toFixed(2)) : RATES_TO_INR.AUD,
                                CAD: d1.rates.CAD ? Number((inr1 / d1.rates.CAD).toFixed(2)) : RATES_TO_INR.CAD
                            };
                        }
                    }
                } catch (_) {}

                const r2 = await fetch('https://api.frankfurter.app/latest?from=USD&to=INR,EUR,GBP,AUD,CAD', { cache: 'no-store' });
                if (!r2.ok) throw new Error('FX API unavailable');
                const d2 = await r2.json();
                const inr2 = d2 && d2.rates && d2.rates.INR;
                if (typeof inr2 !== 'number' || inr2 < 40 || inr2 > 300) throw new Error('Invalid FX rate');

                return {
                    USD: Number(inr2.toFixed(2)),
                    EUR: d2.rates.EUR ? Number((inr2 / d2.rates.EUR).toFixed(2)) : RATES_TO_INR.EUR,
                    GBP: d2.rates.GBP ? Number((inr2 / d2.rates.GBP).toFixed(2)) : RATES_TO_INR.GBP,
                    AUD: d2.rates.AUD ? Number((inr2 / d2.rates.AUD).toFixed(2)) : RATES_TO_INR.AUD,
                    CAD: d2.rates.CAD ? Number((inr2 / d2.rates.CAD).toFixed(2)) : RATES_TO_INR.CAD
                };
            }

            async function syncRates(force) {
                if (!force && loadCache()) {
                    updateBadgeUI();
                    calculate();
                    return;
                }
                fxStatusText = 'Syncing';
                updateBadgeUI();
                if (els.refreshFxBtn) els.refreshFxBtn.textContent = '↻...';

                try {
                    const fresh = await fetchFreshRates();
                    RATES_TO_INR = fresh;
                    fxStatusText = 'Live';
                    saveCache(fresh);
                } catch (_) {
                    fxStatusText = 'Est.';
                }

                if (els.refreshFxBtn) els.refreshFxBtn.textContent = '↻';
                updateBadgeUI();
                calculate();
            }

            function calcScenario(gross, platformPct, fxPct, taxRate, rate) {
                const platformFee = gross * (platformPct / 100);
                const afterPlat = Math.max(0, gross - platformFee);
                const fxLoss = afterPlat * (fxPct / 100);
                const afterFx = Math.max(0, afterPlat - fxLoss);
                const taxCut = gross * taxRate;
                const netForeign = Math.max(0, afterFx - taxCut);

                return {
                    gross: gross,
                    grossINR: gross * rate,
                    platformFee: platformFee,
                    platformINR: platformFee * rate,
                    fxLoss: fxLoss,
                    fxINR: fxLoss * rate,
                    taxCut: taxCut,
                    taxINR: taxCut * rate,
                    netForeign: netForeign,
                    netINR: netForeign * rate
                };
            }

            function calculate() {
                const curr = els.currency ? els.currency.value : 'USD';
                const sym = getSymbol(curr);
                const rate = RATES_TO_INR[curr] || 93.00;
                const gross = Math.max(0, parseFloat(els.amount && els.amount.value) || 0);

                const isCustomPlat = els.platform && els.platform.value === 'custom';
                if (els.customPlatformBox) {
                    els.customPlatformBox.classList.toggle('hidden', !isCustomPlat);
                }
                const platformPct = isCustomPlat
                    ? (parseFloat(els.customPlatformSlider && els.customPlatformSlider.value) || 0)
                    : (parseFloat(els.platform && els.platform.value) || 0);

                const fxSpreadPct = parseFloat(els.fxSpreadSlider && els.fxSpreadSlider.value) || 0;
                const taxRate = TAX_RATES[els.tax && els.tax.value] ?? 0;
                const weeklyHours = Math.max(1, parseFloat(els.hours && els.hours.value) || 20);

                if (els.symbolPrefix) els.symbolPrefix.textContent = sym;
                if (els.customPlatformVal) els.customPlatformVal.textContent = platformPct + '%';
                if (els.fxSpreadLabel) els.fxSpreadLabel.textContent = fxSpreadPct.toFixed(1) + '%';
                if (els.hoursVal) els.hoursVal.textContent = weeklyHours + ' hrs';
                if (els.livePairLabel) els.livePairLabel.textContent = curr + '/INR';
                if (els.liveRateDisplay) els.liveRateDisplay.textContent = '₹' + rate.toFixed(2);
                if (els.baseRateSummary) els.baseRateSummary.textContent = 'Base Rate: ₹' + rate.toFixed(2) + ' / ' + curr;
                if (els.netCurrencyCode) els.netCurrencyCode.textContent = curr;

                const res = calcScenario(gross, platformPct, fxSpreadPct, taxRate, rate);

                if (els.netTakeHomeINR) els.netTakeHomeINR.textContent = fmtINR(res.netINR);
                if (els.netTakeHomeForeign) els.netTakeHomeForeign.textContent = fmtForeign(res.netForeign, sym);

                const monthlyHours = weeklyHours * 4.33;
                if (els.realHourlyRate) els.realHourlyRate.textContent = sym + (res.netForeign / monthlyHours).toFixed(2) + ' / hr';
                if (els.grossHourly) els.grossHourly.textContent = sym + (gross / monthlyHours).toFixed(2);

                const retainedPct = gross > 0 ? Math.max(0, Math.min(100, (res.netForeign / gross) * 100)) : 0;
                const platPctBar = gross > 0 ? Math.max(0, Math.min(100, (res.platformFee / gross) * 100)) : 0;
                const fxPctBar = gross > 0 ? Math.max(0, Math.min(10
